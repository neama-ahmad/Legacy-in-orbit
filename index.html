<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legacy in orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Lalezar&family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#05060f; --nebula:#5b3df5; --aurora:#5ef2e0; --solar:#ffc857; --star:#e8ecff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(ellipse 60% 50% at 20% 85%, rgba(91,61,245,.28), transparent 70%),
    radial-gradient(ellipse 50% 40% at 85% 15%, rgba(94,242,224,.12), transparent 70%),
    var(--void);
  color:var(--star); font-family:'Cairo',sans-serif; overflow:hidden;
  display:grid; place-items:center; min-height:100vh;
}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}

.stage{position:relative;z-index:1;width:min(92vw,720px);aspect-ratio:1;display:grid;place-items:center}

/* planet */
.planet{
  position:absolute;width:34%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #ffe7a6 0%, var(--solar) 22%, #b5542b 62%, #2a0f2e 100%);
  box-shadow:0 0 80px 10px rgba(255,200,87,.25), inset -18px -14px 40px rgba(5,6,15,.7);
  animation:rise 2.2s cubic-bezier(.2,.8,.2,1) both;
}
/* orbits */
.orbit{
  position:absolute;border-radius:50%;border:1px solid rgba(232,236,255,.16);
  animation:spin linear infinite;
}
.o1{width:52%;height:52%;animation-duration:22s;transform:rotateX(68deg)}
.o2{width:74%;height:74%;animation-duration:38s;animation-direction:reverse;border-style:dashed;border-color:rgba(94,242,224,.22)}
.o3{width:98%;height:98%;animation-duration:60s;border-color:rgba(91,61,245,.35)}
.orbit i{position:absolute;top:-5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--aurora);box-shadow:0 0 14px 3px var(--aurora)}
.o1 i{background:var(--solar);box-shadow:0 0 14px 3px var(--solar)}
.o3 i{background:#b9a8ff;box-shadow:0 0 14px 3px var(--nebula);width:7px;height:7px}

/* copy */
.copy{position:relative;text-align:center;padding:0 1rem;display:flex;flex-direction:column;align-items:center;gap:1.1rem}
.brand{
  font-family:'Orbitron',sans-serif;font-size:clamp(1rem,3.2vw,1.5rem);letter-spacing:.28em;
  direction:ltr;color:var(--star);text-shadow:0 0 18px rgba(94,242,224,.6);
  animation:fade 1.6s .6s both;
}
h1{
  font-family:'Lalezar',sans-serif;font-weight:400;line-height:1.15;
  font-size:clamp(2.4rem,8vw,4.6rem);
  background:linear-gradient(180deg,#fff 30%,#b9c4ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 24px rgba(5,6,15,.9));
  animation:fade 1.6s .9s both;
}
p{
  font-weight:300;font-size:clamp(1.05rem,2.6vw,1.35rem);line-height:1.8;max-width:30ch;
  color:#c9d0f5;text-shadow:0 2px 14px var(--void);
  animation:fade 1.6s 1.2s both;
}
.cta{
  margin-top:.6rem;position:relative;display:inline-block;text-decoration:none;
  font-family:'Cairo',sans-serif;font-weight:700;font-size:1.25rem;color:var(--void);
  background:linear-gradient(135deg,var(--solar),#ff9a4d);
  padding:.85rem 2.6rem;border-radius:999px;
  box-shadow:0 0 0 0 rgba(255,200,87,.6),0 10px 30px rgba(255,154,77,.3);
  transition:transform .25s,box-shadow .25s;
  animation:fade 1.6s 1.5s both,pulse 2.8s 3s infinite;
}
.cta:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 0 0 10px rgba(255,200,87,.15),0 14px 40px rgba(255,154,77,.5)}
.cta:active{transform:scale(.97)}
.cta:focus-visible{outline:3px solid var(--aurora);outline-offset:5px}

@keyframes spin{to{rotate:360deg}}
@keyframes fade{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
@keyframes rise{from{opacity:0;scale:.4}to{opacity:1;scale:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,200,87,.55),0 10px 30px rgba(255,154,77,.3)}70%,100%{box-shadow:0 0 0 22px rgba(255,200,87,0),0 10px 30px rgba(255,154,77,.3)}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>

<main class="stage">
  <div class="planet" aria-hidden="true"></div>
  <div class="orbit o1" aria-hidden="true"><i></i></div>
  <div class="orbit o2" aria-hidden="true"><i></i></div>
  <div class="orbit o3" aria-hidden="true"><i></i></div>

  <section class="copy">
    <div class="brand">Legacy in orbit</div>
    <h1>أهلاً بكم في إرث</h1>
    <p>استكشف معنا إرث الفضاء العظيم</p>
    <a class="cta" href="base.html">ابدأ رحلتك</a>
  </section>
</main>

<script>
(function(){
  const c=document.getElementById('stars'),x=c.getContext('2d');
  let w,h,stars=[],mx=0,my=0,still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){
    w=c.width=innerWidth;h=c.height=innerHeight;
    stars=Array.from({length:Math.min(260,Math.floor(w*h/6000))},()=>({
      x:Math.random()*w,y:Math.random()*h,z:Math.random()*.9+.1,t:Math.random()*6.28
    }));
  }
  function draw(){
    x.clearRect(0,0,w,h);
    for(const s of stars){
      s.t+=.02;
      const px=s.x+mx*s.z*18,py=s.y+my*s.z*18;
      x.globalAlpha=.35+.65*Math.abs(Math.sin(s.t))*s.z;
      x.fillStyle=s.z>.8?'#ffe7a6':'#e8ecff';
      x.beginPath();x.arc(px,py,s.z*1.5,0,6.28);x.fill();
      if(!still){s.y+=s.z*.12;if(s.y>h)s.y=0}
    }
    requestAnimationFrame(draw);
  }
  addEventListener('resize',size);
  addEventListener('pointermove',e=>{mx=e.clientX/w-.5;my=e.clientY/h-.5});
  size();draw();
})();
</script>
</body>
</html>
