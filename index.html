<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إرث | Legacy - استكشاف الفضاء</title>
    <!-- استيراد Tailwind CSS للتنسيق المتجاوب -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استيراد خطوط برمجية (Monospace) تدعم العربية والإنجليزية بدقة عالية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* إعدادات الخطوط والألوان الأساسية */
        :root {
            --bg-space: #1c2136;
            --accent-cyan: #38bdf8;
            --accent-amber: #e69201;
            --terminal-green: #10b981;
        }

        body {
            background-color: var(--bg-space);
            color: #e69201;
            /* دمج خط IBM Plex Mono للإنجليزية و IBM Plex Sans Arabic مع لمسة برمجية للعربية */
            font-family: 'IBM Plex Mono', 'IBM Plex Sans Arabic', monospace;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .typewriter{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width:100%;
            height: 150px;
        }
        .typewriter p{
  overflow: hidden;
  border-left:  .15em solid #90c6db;
  white-space:wrap;
  letter-spacing:  .10em;
  font-size: 34px;
  animation: typing 3.5s steps(40, end), blink-caret .75s step-end infinite;
}


@keyframes typing{
  from {width: 0}
  to { width: 100%}
}

@keyframes blink-caret {
from, to {border-color: transparent}
50% {border-color: #90c6db}
}

        /* تأثير المؤشر البرمجي الوامض */
        .terminal-cursor {
            display: inline-block;
            width: 0.65em;
            height: 1.15em;
            background-color: #e69201;
            vertical-align: middle;
            margin-inline-start: 4px;
            box-shadow: 0 0 10px #38bdf8;
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* تأثير التوهج للزر الفضائي */
        .space-btn {
            position: relative;
            background: rgba(14, 165, 233, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.5);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15), inset 0 0 12px rgba(56, 189, 248, 0.1);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .space-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.35), transparent);
            transition: left 0.6s ease;
        }

        .space-btn:hover::before {
            left: 100%;
        }

        .space-btn:hover {
            background: rgba(56, 189, 248, 0.22);
            border-color: #38bdf8;
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.45), inset 0 0 20px rgba(56, 189, 248, 0.25);
            transform: translateY(-2px);
        }

        .space-btn:active {
            transform: translateY(0);
        }

        /* خطوط المسح الضوئي الخفيفة لإضفاء طابع شاشات الفضاء */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%,
                rgba(0, 0, 0, 0.25)
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* توهج ناعم للنصوص */
        .text-glow {
            text-shadow: 0 0 18px rgba(226, 232, 240, 0.25);
        }

        .cyan-glow {
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        /* شريط التمرير المخصص */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #020308;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 3px;
        }
        .buttons{
            display:flex;
            flex-direction: column;
            align-items: center;
            width: 50%;
          
        }

        .buttons .button{
    padding: 14px;
    width: 60%;
    text-align: center;
    border: 2px solid #e69201;
    border-radius: 5px;
    font-size: 22px;
    cursor: pointer;
}
.buttons .button:hover{
  background-color: none;
  border:1px solid #fff;
  color:#ffff;
  
}
    </style>
</head>
<body class="relative flex flex-col justify-between min-h-screen selection:bg-sky-500/30 selection:text-sky-200">
<!-- لوحة رسم النجوم المتحركة في الخلفية -->
<canvas id="starfield" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>

<!-- طبقة تأثير خطوط المسح الشفافة -->
<div class="fixed inset-0 scanlines z-0 opacity-40"></div>

<!-- الشريط العلوي (Header) -->
<header class="relative z-20 w-full max-w-6xl mx-auto px-5 sm:px-8 pt-6 pb-4 flex items-center justify-between">
    <!-- شعار المشروع مع مؤشر حالة النظام -->
    <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg border border-sky-500/40 bg-orange-950/30 flex items-center justify-center shadow-[0_0_15px_rgba(56,189,248,0.2)]">
            <!-- أيقونة مدار / قمر صناعي SVG -->
            <svg class="w-5 h-5 text-orange-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                <circle cx="12" cy="12" r="3" />
                <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-30 12 12)" />
                <circle cx="18.5" cy="7.5" r="1.2" fill="currentColor" />
            </svg>
        </div>
        <div class="flex flex-col">
            <span id="brand-name" class="text-lg sm:text-xl font-bold tracking-wider text-white cyan-glow">Legacy in Orbit</span>
    
        </div>
    </div>

    <!-- زر تبديل اللغة (العربية / English) -->
    <button 
        id="lang-toggle" 
        type="button"
        aria-label="Switch Language"
        class="group flex items-center gap-2 px-3.5 py-2 rounded-lg border border-slate-700/80 bg-slate-900/60 hover:border-sky-400/60 hover:bg-slate-800/80 text-xs sm:text-sm font-medium text-slate-200 transition-all duration-300 backdrop-blur-md cursor-pointer shadow-lg">
        <svg class="w-4 h-4 text-sky-400 group-hover:rotate-12 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
        </svg>
        <span id="lang-label">English</span>
    </button>
</header>

<!-- المحتوى الرئيسي في منتصف الشاشة -->
<main class="relative z-10 flex-grow flex flex-col items-center justify-center px-5 sm:px-8 py-10 max-w-4xl mx-auto w-full text-center">
    
   

    <!-- حاوية النص المكتوب بتأثير Typing -->
    <div class="typewriter">
        <p>مرحبا بكم في إرث..استكشف إرث الفضاء العظيم..</p>
    </div>

    <!-- زر "ابدأ رحلتك" -->
    <div class="buttons">
        <a href="base.html" class="button">ابدأ رحلتك</a>
    </div>

</main>



<script>
    /**
     * 1. قاموس النصوص لدعم اللغتين العربية والإنجليزية بشكل كامل
     */
    const translations = {
        ar: {
            dir: 'rtl',
            langAttr: 'ar',
            pageTitle: 'إرث | IRTH - استكشاف المعدات الفضائية المهجورة',
            langToggleLabel: 'English',
            statusText: 'النظام متصل // 2026',
            terminalTag: 'بروتوكول_الأرشيف // المدار • القمر • المريخ',
            heroText: 'مرحبا بكم في إرث لاستكشاف المعدات المهجورة في المدار على سطح القمر والكوكب الأحمر',
            sectorOrbit: 'المدار الأرضي',
            sectorMoon: 'سطح القمر',
            sectorMars: 'الكوكب الأحمر',
            startBtn: 'ابدأ رحلتك',
            footerCopy: '© 2026 منصة إرث لاستكشاف الفضاء',
            modalTitle: 'بوابة الاستكشاف // اختر الوجهة',
            modalDesc: 'تم تفعيل الاتصال بأرشيف «إرث». اختر أحد القطاعات الفضائية التالية لمعاينة المعدات والمركبات المهجورة الموثقة في السجلات:',
            cardOrbitTitle: 'المقبرة المدارية',
            cardOrbitSub: 'أقمار صناعية خارج الخدمة ومحطات مدارية قديمة.',
            cardMoonTitle: 'سطح القمر',
            cardMoonSub: 'مركبات الهبوط، عربات الاستكشاف، ومعدات التجارب.',
            cardMarsTitle: 'الكوكب الأحمر',
            cardMarsSub: 'مسبارات المريخ الصامتة ومظلات الهبوط المتروكة.',
            telemetryDefault: '> بانتظار تحديد القطاع لبدء المسح الراداري...',
                telemetryData: {
                    orbit: '> [المدار المرتفع - 36,000 كم]: رصد 412 قمرًا صناعيًا صامتًا في مدار المقبرة (Graveyard Orbit). الحالة: مستقرة.',
                    moon: '> [بحر السكون - القمر]: رصد 68 مركبة هبوط وعربة قمرية متوقفة منذ عقود. الإشعاع الشمسي: مرتفع.',
                    mars: '> [فوهة جيزيرو وسهل إيليزيوم - المريخ]: رصد 14 مسبارًا ودرعًا حراريًا مهجورًا مغطى بالغبار المريخي.'
                }
            },
            en: {
                dir: 'ltr',
                langAttr: 'en',
                pageTitle: 'IRTH | Exploring Abandoned Space Equipment',
                langToggleLabel: 'العربية',
                statusText: 'SYS.ONLINE // 2026',
                terminalTag: 'ARCHIVE_PROTOCOL // ORBIT • MOON • MARS',
                heroText: 'Welcome to Irth to explore abandoned equipment in orbit, on the surface of the Moon, and the Red Planet',
                sectorOrbit: 'Earth Orbit',
                sectorMoon: 'Lunar Surface',
                sectorMars: 'Red Planet',
                startBtn: 'Start Your Journey',
                footerCopy: '© 2026 IRTH SPACE ARCHIVE',
                modalTitle: 'EXPLORATION GATEWAY // SELECT SECTOR',
                modalDesc: 'Connection to the IRTH archive established. Select a space sector below to inspect cataloged derelict spacecraft and hardware:',
                cardOrbitTitle: 'Orbital Graveyard',
                cardOrbitSub: 'Decommissioned satellites and legacy orbital stages.',
                cardMoonTitle: 'Lunar Surface',
                cardMoonSub: 'Historic landers, lunar rovers, and surface experiments.',
                cardMarsTitle: 'The Red Planet',
                cardMarsSub: 'Silent Martian rovers, landers, and discarded aeroshells.',
                telemetryDefault: '> Awaiting sector selection to initiate radar telemetry...',
                telemetryData: {
                    orbit: '> [GEO GRAVEYARD - 36,000 KM]: 412 decommissioned satellites tracked in supersynchronous orbit. Status: Nominal.',
                    moon: '> [MARE TRANQUILLITATIS - LUNA]: 68 derelict landers and rovers cataloged across lunar maria. Solar flux: High.',
                    mars: '> [ELYSIUM & JEZERO - MARS]: 14 silent surface probes, backshells, and parachutes mapped beneath Martian dust.'
                }
            }
        };

        // الحالة الافتراضية للغة
        let currentLang = 'ar';
        let typingTimer = null;

        // عناصر واجهة المستخدم
        const htmlEl = document.documentElement;
        const typedTextEl = document.getElementById('typed-text');
        const langToggleBtn = document.getElementById('lang-toggle');
        const langLabelEl = document.getElementById('lang-label');
        const ctaWrapper = document.getElementById('cta-wrapper');
        const sectorsPreview = document.getElementById('sectors-preview');
        const startBtnIcon = document.getElementById('start-btn-icon');

        /**
         * 2. دالة تأثير الكتابة البرمجية السريعة (Fast Typing Effect)
         */
        function startTypingEffect(text) {
            if (typingTimer) {
                clearTimeout(typingTimer);
            }

            typedTextEl.textContent = '';
            // إظهار الزر والقطاعات بسلاسة أثناء أو فور بدء الكتابة
            ctaWrapper.classList.remove('opacity-0', 'translate-y-4');
            sectorsPreview.classList.remove('opacity-0', 'translate-y-3');

            let index = 0;
            // سرعة كتابة سريعة قليلاً ومريحة للعين (28 مللي ثانية لكل حرف)
            const baseSpeed = 28;

            function typeNextChar() {
                if (index < text.length) {
                    typedTextEl.textContent += text.charAt(index);
                    index++;
                    // تنويع طفيف جداً في السرعة لمحاكاة الكتابة الحية
                    const jitter = Math.random() * 14;
                    typingTimer = setTimeout(typeNextChar, baseSpeed + jitter);
                }
            }

            typeNextChar();
        }

        /**
         * 3. دالة تحديث اللغة واتجاه الصفحة (RTL / LTR)
         */
        function applyLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            // تحديث سمات HTML والاتجاه
            htmlEl.setAttribute('lang', t.langAttr);
            htmlEl.setAttribute('dir', t.dir);
            document.title = t.pageTitle;

            // تحديث النصوص في الصفحة
            langLabelEl.textContent = t.langToggleLabel;
            document.getElementById('status-text').textContent = t.statusText;
            document.getElementById('terminal-tag').textContent = t.terminalTag;
            document.getElementById('sector-orbit').textContent = t.sectorOrbit;
            document.getElementById('sector-moon').textContent = t.sectorMoon;
            document.getElementById('sector-mars').textContent = t.sectorMars;
            document.getElementById('start-btn-text').textContent = t.startBtn;
            document.getElementById('footer-copy').textContent = t.footerCopy;

            // تحديث نصوص النافذة التفاعلية
            document.getElementById('modal-title').textContent = t.modalTitle;
            document.getElementById('modal-desc').textContent = t.modalDesc;
            document.getElementById('card-orbit-title').textContent = t.cardOrbitTitle;
            document.getElementById('card-orbit-sub').textContent = t.cardOrbitSub;
            document.getElementById('card-moon-title').textContent = t.cardMoonTitle;
            document.getElementById('card-moon-sub').textContent = t.cardMoonSub;
            document.getElementById('card-mars-title').textContent = t.cardMarsTitle;
            document.getElementById('card-mars-sub').textContent = t.cardMarsSub;
            document.getElementById('telemetry-output').textContent = t.telemetryDefault;

            // عكس اتجاه أيقونة السهم في الزر حسب اللغة
            if (lang === 'ar') {
                startBtnIcon.style.transform = 'rotate(180deg)';
            } else {
                startBtnIcon.style.transform = 'rotate(0deg)';
            }

            // إعادة تشغيل تأثير الكتابة للنص الرئيسي باللغة الجديدة
            startTypingEffect(t.heroText);
        }

        // مستمع حدث زر تبديل اللغة
        langToggleBtn.addEventListener('click', () => {
            const nextLang = currentLang === 'ar' ? 'en' : 'ar';
            applyLanguage(nextLang);
        });


        /**
         * 4. التفاعل مع زر "ابدأ رحلتك" والنافذة التفاعلية (Modal)
         */
        const startBtn = document.getElementById('start-btn');
        const missionModal = document.getElementById('mission-modal');
        const closeModalBtn = document.getElementById('close-modal');
        const telemetryOutput = document.getElementById('telemetry-output');
        const targetCards = document.querySelectorAll('.target-card');

        startBtn.addEventListener('click', () => {
            missionModal.classList.remove('hidden');
            missionModal.classList.add('flex');
        });

        function closeModal() {
            missionModal.classList.add('hidden');
            missionModal.classList.remove('flex');
        }

        closeModalBtn.addEventListener('click', closeModal);
        missionModal.addEventListener('click', (e) => {
            if (e.target === missionModal) closeModal();
        });

        // عرض بيانات المسح عند اختيار أحد القطاعات
        targetCards.forEach(card => {
            card.addEventListener('click', () => {
                const sector = card.getAttribute('data-target');
                const message = translations[currentLang].telemetryData[sector];
                telemetryOutput.textContent = '';
                let i = 0;
                const scanInterval = setInterval(() => {
                    if (i < message.length) {
                        telemetryOutput.textContent += message.charAt(i);
                        i++;
                    } else {
                        clearInterval(scanInterval);
                    }
                }, 15);
            });
        });

        /**
         * 5. محاكاة خلفية الفضاء والنجوم المتحركة المتلألئة (Canvas Starfield)
         */
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let shootingStars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            // عدد النجوم يتناسب مع مساحة الشاشة
            const starCount = Math.floor((canvas.width * canvas.height) / 3800);
            for (let i = 0; i < starCount; i++) {
                const isColored = Math.random() > 0.85;
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5 + 0.3,
                    alpha: Math.random() * 0.8 + 0.2,
                    alphaChange: (Math.random() * 0.015 + 0.004) * (Math.random() < 0.5 ? 1 : -1),
                    speedY: Math.random() * 0.14 + 0.02, // حركة انجراف بطيئة جداً للفضاء
                    color: isColored 
                        ? (Math.random() > 0.5 ? '#7dd3fc' : '#fde68a') 
                        : '#ffffff'
                });
            }
        }

        function spawnShootingStar() {
            if (Math.random() < 0.006 && shootingStars.length < 2) {
                shootingStars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * (canvas.height * 0.4),
                    length: Math.random() * 70 + 40,
                    speed: Math.random() * 7 + 5,
                    angle: Math.PI / 4 + (Math.random() * 0.2 - 0.1),
                    opacity: 1
                });
            }
        }

        function animateStars() {
            // خلفية سوداء حالكة للفضاء
            ctx.fillStyle = '#020308';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // رسم وتحديث النجوم الثابتة والمتلألئة
            for (let i = 0; i < stars.length; i++) {
                const s = stars[i];
                s.alpha += s.alphaChange;
                if (s.alpha <= 0.15 || s.alpha >= 1) {
                    s.alphaChange *= -1;
                }

                s.y -= s.speedY;
                if (s.y < 0) {
                    s.y = canvas.height;
                    s.x = Math.random() * canvas.width;
                }

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = s.color;
                ctx.globalAlpha = Math.max(0.1, Math.min(1, s.alpha));
                ctx.fill();
            }

            // رسم الشهب العابرة الخفيفة بين الحين والآخر
            spawnShootingStar();
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const ss = shootingStars[i];
                const endX = ss.x - Math.cos(ss.angle) * ss.length;
                const endY = ss.y - Math.sin(ss.angle) * ss.length;

                const grad = ctx.createLinearGradient(ss.x, ss.y, endX, endY);
                grad.addColorStop(0, rgba(186, 230, 253,0.6));
                grad.addColorStop(1, 'rgba(186, 230, 253, 0)');
                ctx.beginPath();
                ctx.moveTo(ss.x, ss.y);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.3;
                ctx.globalAlpha = ss.opacity;
                ctx.stroke();

                ss.x += Math.cos(ss.angle) * ss.speed;
                ss.y += Math.sin(ss.angle) * ss.speed;
                ss.opacity -= 0.015;

                if (ss.opacity <= 0) {
                    shootingStars.splice(i, 1);
                }
            }

            ctx.globalAlpha = 1;
            requestAnimationFrame(animateStars);
        }

        // تهيئة الصفحة عند التحميل
        window.addEventListener('resize', resizeCanvas);
        window.onload = function() {
            resizeCanvas();
            animateStars();
            applyLanguage('ar');
        };
    </script>
</body>
</html>
